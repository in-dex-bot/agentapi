    // Función para contar tokens de manera más precisa
    function countTokens(text) {
      if (!text) return 0;
      
      // Método mejorado de conteo de tokens
      // 1. Dividir por espacios y signos de puntuación
      const words = text.trim().split(/\s+/);
      let tokenCount = 0;
      
      words.forEach(word => {
        // Palabras largas tienden a ser múltiples tokens
        if (word.length <= 4) {
          tokenCount += 1;
        } else if (word.length <= 8) {
          tokenCount += Math.ceil(word.length / 4);
        } else {
          tokenCount += Math.ceil(word.length / 3.5);
        }
        
        // Agregar tokens por puntuación
        const punctuation = word.match(/[.,!?;:()[\]{}'"]/g);
        if (punctuation) {
          tokenCount += punctuation.length * 0.5;
        }
      });
      
      // Ajuste por caracteres especiales y números
      const specialChars = text.match(/[0-9@#$%^&*+=<>]/g);
      if (specialChars) {
        tokenCount += specialChars.length * 0.3;
      }
      
      return Math.ceil(tokenCount);
    }

    function DeepSeekCalculator() {
      const [state, setState] = useState({
        inputTokens: 1000,
        outputTokens: 500,
        inputText: "",
        outputText: "",
        model: "deepseek-chat",
        usdCost: 0,
        copCost: 0,
        usdRate: 3900,
        inputMode: "tokens" // "tokens" or "text"
      });

      useEffect(() => {
        axios.get("https://api.coingecko.com/api/v3/simple/price?ids=usd&vs_currencies=cop")
          .then(res => {
            setState(prev => ({ ...prev, usdRate: res.data.usd.cop }));
          })
          .catch(() => {
            // Fallback to default rate if API fails
          });
      }, []);

      useEffect(() => {
        calculateCost();
      }, [state.inputTokens, state.outputTokens, state.model, state.usdRate]);

      useEffect(() => {
        if (state.inputMode === "text") {
          const inputTokens = countTokens(state.inputText);
          const outputTokens = countTokens(state.outputText);
          setState(prev => ({ ...prev, inputTokens, outputTokens }));
        }
      }, [state.inputText, state.outputText, state.inputMode]);

      const handleChange = (e) => {
        const { name, value } = e.target;
        setState(prev => ({ ...prev, [name]: name.includes('Tokens') ? (parseFloat(value) || 0) : value }));
      };

      const toggleInputMode = (mode) => {
        setState(prev => ({ ...prev, inputMode: mode }));
      };

      const calculateCost = () => {
        const { inputTokens, outputTokens, model, usdRate } = state;
        const prices = {
          'deepseek-chat': { input: 0.0007, output: 0.0028 },
          'deepseek-coder': { input: 0.0015, output: 0.0060 }
        };
        const inputCost = (inputTokens / 1000000) * prices[model].input;
        const outputCost = (outputTokens / 1000000) * prices[model].output;
        const totalUSD = inputCost + outputCost;
        setState(prev => ({
          ...prev,
          usdCost: totalUSD.toFixed(5),
          copCost: (totalUSD * usdRate).toFixed(2)
        }));
      };

      return (
        <div>
          <h2 className="mb-4 text-primary">🔮 DeepSeek API</h2>
          
          <div className="form-group">
            <label>Modelo:</label>
            <select className="form-control mb-3" name="model" onChange={handleChange} value={state.model}>
              <option value="deepseek-chat">Chat (Conversación)</option>
              <option value="deepseek-coder">Coder (Programación)</option>
            </select>
          </div>

          <div className="toggle-buttons">
            <button 
              className={`toggle-btn ${state.inputMode === 'tokens' ? 'active' : ''}`}
              onClick={() => toggleInputMode('tokens')}
            >
              📊 Por Tokens
            </button>
            <button 
              className={`toggle-btn ${state.inputMode === 'text' ? 'active' : ''}`}
              onClick={() => toggleInputMode('text')}
            >
              📝 Por Texto
            </button>
          </div>

          {state.inputMode === 'tokens' ? (
            <div className="row">
              <div className="col-md-6">
                <label>Tokens Entrada:</label>
                <input type="number" className="form-control" name="inputTokens" value={state.inputTokens} onChange={handleChange} />
              </div>
              <div className="col-md-6">
                <label>Tokens Salida:</label>
                <input type="number" className="form-control" name="outputTokens" value={state.outputTokens} onChange={handleChange} />
              </div>
            </div>
          ) : (
            <div>
              <div className="form-group">
                <label>Texto de Entrada (Prompt):</label>
                <textarea 
                  className="form-control text-input" 
                  name="inputText" 
                  value={state.inputText} 
                  onChange={handleChange}
                  placeholder="Escribe tu prompt aquí..."
                />
                <div className="token-info-box mt-2">
                  <strong>📊 Tokens de entrada: {state.inputTokens}</strong>
                  <div className="token-breakdown">
                    Palabras: ~{state.inputText.trim().split(/\s+/).filter(w => w).length} | 
                    Caracteres: {state.inputText.length}
                  </div>
                </div>
              </div>
              
              <div className="form-group">
                <label>Texto de Salida Esperado (Opcional):</label>
                <textarea 
                  className="form-control text-input" 
                  name="outputText" 
                  value={state.outputText} 
                  onChange={handleChange}
                  placeholder="Respuesta esperada de la IA (opcional)..."
                />
                <div className="token-info-box mt-2">
                  <strong>📊 Tokens de salida: {state.outputTokens}</strong>

                    Palabras: ~{state.outputText.trim().split(/\s+/).filter(w => w).length} | 
                    Caracteres: {state.outputText.length}
                  </div>
                </div>
              </div>
            </div>
          )}

          <div className="result-box mt-3">

              <div className="col-md-6">
                <label>Tokens Salida:</label>
                <input type="number" className="form-control" name="outputTokens" value={state.outputTokens} onChange={handleChange} />
              </div>
            </div>
          ) : (
            <div>
              <div className="form-group">
                <label>Texto de Entrada (Prompt):</label>
                <textarea 
                  className="form-control text-input" 
                  name="inputText" 
                  value={state.inputText} 
                  onChange={handleChange}
                  placeholder="Escribe tu prompt aquí..."
                />
                <div className="token-info-box mt-2">
                  <strong>📊 Tokens de entrada: {state.inputTokens}</strong>
                  <div className="token-breakdown">
                    Palabras: ~{state.inputText.trim().split(/\s+/).filter(w => w).length} | 
                    Caracteres: {state.inputText.length}
                  </div>
                </div>
              </div>
              
              <div className="form-group">
                <label>Texto de Salida Esperado (Opcional):</label>
                <textarea 
                  className="form-control text-input" 
                  name="outputText" 
                  value={state.outputText} 
                  onChange={handleChange}
                  placeholder="Respuesta esperada de la IA (opcional)..."
                />
                <div className="token-info-box mt-2">
                  <strong>📊 Tokens de salida: {state.outputTokens}</strong>
                  <div className="token-breakdown">
                    Palabras: ~{state.outputText.trim().split(/\s+/).filter(w => w).length} | 
                    Caracteres: {state.outputText.length}
                  </div>
                </div>
              </div>
            </div>
          )}

          <div className="result-box mt-3">
            <h5>💰 Costo Estimado:</h5>
            <div className="h4 text-success">USD ${state.usdCost}</div>
            <div className="h5 text-info">COP ${state.copCost}</div>
            <div className="token-breakdown mt-2">
              <small>
                📊 Total tokens: {state.inputTokens + state.outputTokens} 
                ({state.inputTokens} entrada + {state.outputTokens} salida)
              </small>
            </div>
            <small className="text-muted">Tasa: 1 USD = ${state.usdRate} COP</small>
          </div>
        </div>
      );
    }

    ReactDOM.render(<CombinedCalculators />, document.getElementById('root'));
  </script>
</body>
</html>
